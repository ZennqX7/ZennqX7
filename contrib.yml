name: Contribution Skyline

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate contribution skyline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: ${{ github.repository_owner }}
        run: |
          mkdir -p dist
          node - <<'EOF'
          const fs = require("fs");
          const query = `query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{contributionCount weekday}}}}}}`;

          (async () => {
            const res = await fetch("https://api.github.com/graphql", {
              method: "POST",
              headers: {
                Authorization: "Bearer " + process.env.GH_TOKEN,
                "Content-Type": "application/json",
                "User-Agent": "contrib-skyline",
              },
              body: JSON.stringify({ query, variables: { login: process.env.LOGIN } }),
            });
            const json = await res.json();
            if (!res.ok || json.errors || !json.data || !json.data.user) {
              console.error(JSON.stringify(json).slice(0, 500));
              process.exit(1);
            }
            const cal = json.data.user.contributionsCollection.contributionCalendar;
            const weeks = cal.weeks;
            const totals = weeks.map((w) => w.contributionDays.reduce((s, d) => s + d.contributionCount, 0));
            const max = Math.max(1, ...totals);

            const pad = 26, pitch = 16, bw = 11, base = 190, maxH = 150;
            const W = pad * 2 + weeks.length * pitch - (pitch - bw);
            const H = 262;
            const ease = ".45 0 .55 1";
            const splines = Array(6).fill(ease).join(";");

            const build = (color) => {
              let out = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Contribution skyline">`;
              out += `<defs>`
                + `<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="1"/><stop offset="1" stop-color="${color}" stop-opacity="0.18"/></linearGradient>`
                + `<linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.26"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient>`
                + `</defs>`;
              out += `<line x1="${pad - 6}" y1="${base}" x2="${W - pad + 6}" y2="${base}" stroke="${color}" stroke-opacity="0.18"/>`;
              totals.forEach((t, i) => {
                const h = Math.max(6, Math.round((maxH * t) / max));
                const hr = Math.round(h * 0.34);
                const x = pad + i * pitch;
                const begin = (i * 0.05).toFixed(2);
                out += `<g transform="translate(${x} ${base})"><g transform="scale(1 0)">`
                  + `<animateTransform attributeName="transform" type="scale" values="1 0;1 1;1 0.86;1 1;1 0.86;1 1;1 0" keyTimes="0;0.15;0.35;0.55;0.75;0.88;1" calcMode="spline" keySplines="${splines}" dur="7s" begin="${begin}s" repeatCount="indefinite"/>`
                  + `<rect x="0" y="${-h}" width="${bw}" height="${h}" rx="3" fill="url(#g)"/>`
                  + `<rect x="0" y="2" width="${bw}" height="${hr}" rx="3" fill="url(#r)"/>`
                  + `</g></g>`;
              });
              return out + "</svg>";
            };

            fs.writeFileSync("dist/contrib-dark.svg", build("#ffffff"));
            fs.writeFileSync("dist/contrib-light.svg", build("#0b0b0b"));
            console.log("total contributions:", cal.totalContributions, "| weeks:", weeks.length);
          })();
          EOF

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
